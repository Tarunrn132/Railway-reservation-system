# ===================================================================
# RailReserve - Production Configuration Profile (PostgreSQL on Render)
# Active when SPRING_PROFILES_ACTIVE=prod
# ===================================================================

server.port=${PORT:8080}

# -------------------------------------------------------------------
# PostgreSQL Production DataSource
# Accepts JDBC URL (e.g. jdbc:postgresql://...) or auto-configured via DatabaseConfig
# -------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=RailReserveProdHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Disable SQL initialization scripts in production
spring.sql.init.mode=never

# Disable H2 console in production
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# Production Logging (Structured, No Leaks)
# -------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.railway.reservation=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# -------------------------------------------------------------------
# Actuator Security in Production
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
