# ===================================================================
# Railway Reservation System - Application Configuration
# ===================================================================
spring.application.name=railway-reservation-system
server.port=${PORT:8080}

# Default DataSource: H2 with MySQL Compatibility (Zero-setup Out-of-the-box)
spring.datasource.url=${DB_URL:jdbc:h2:mem:railway_reservation;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automated SQL init scripts to avoid dialect mismatches
spring.sql.init.mode=never

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# Granular Railway Data Providers (Search, Availability, Fare, PNR, Booking)
# -------------------------------------------------------------------
railway.search.provider=${RAILWAY_SEARCH_PROVIDER:}
railway.search.api.url=${RAILWAY_SEARCH_API_URL:}
railway.search.api.key=${RAILWAY_SEARCH_API_KEY:}

railway.availability.provider=${RAILWAY_AVAILABILITY_PROVIDER:}
railway.availability.api.url=${RAILWAY_AVAILABILITY_API_URL:}
railway.availability.api.key=${RAILWAY_AVAILABILITY_API_KEY:}

railway.pnr.provider=${RAILWAY_PNR_PROVIDER:}
railway.pnr.api.url=${RAILWAY_PNR_API_URL:}
railway.pnr.api.key=${RAILWAY_PNR_API_KEY:}

railway.fare.provider=${RAILWAY_FARE_PROVIDER:}
railway.fare.api.url=${RAILWAY_FARE_API_URL:}
railway.fare.api.key=${RAILWAY_FARE_API_KEY:}

railway.booking.provider=${RAILWAY_BOOKING_PROVIDER:}
railway.booking.api.url=${RAILWAY_BOOKING_API_URL:}
railway.booking.api.key=${RAILWAY_BOOKING_API_KEY:}

# Base railway API parameters
railway.api.base-url=${RAILWAY_API_BASE_URL:}
railway.api.url=${RAILWAY_API_URL:${RAILWAY_API_BASE_URL:}}
railway.api.key=${RAILWAY_API_KEY:}
railway.api.provider=${RAILWAY_API_PROVIDER:}

# -------------------------------------------------------------------
# Payment Gateway Configuration (Razorpay / Mock)
# -------------------------------------------------------------------
payment.provider=${PAYMENT_PROVIDER:mock}
payment.api.key=${PAYMENT_API_KEY:}
payment.api.secret=${PAYMENT_API_SECRET:}

# -------------------------------------------------------------------
# SMS Gateway Configuration
# -------------------------------------------------------------------
sms.provider=${SMS_PROVIDER:mock}
sms.api.key=${SMS_API_KEY:}
sms.api.secret=${SMS_API_SECRET:}
sms.sender.id=${SMS_SENDER_ID:RAILRES}

# -------------------------------------------------------------------
# Email Configuration
# -------------------------------------------------------------------
email.provider=${EMAIL_PROVIDER:mock}
email.api.key=${EMAIL_API_KEY:}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# -------------------------------------------------------------------
# Google OAuth 2.0
# -------------------------------------------------------------------
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# Logging
logging.level.com.railway.reservation=INFO
logging.level.org.springframework.web=INFO

# -------------------------------------------------------------------
# Actuator Health and Monitoring Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

